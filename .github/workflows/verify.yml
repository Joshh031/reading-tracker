name: Verify Knowledge Vault
on:
  push:
    branches: [feature/knowledge-vault-v1]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec --yes --package=firebase-tools@13.35.1 -- firebase emulators:exec --only firestore --project demo-knowledge-vault 'npm run test:firestore && npm run test:workflow'
        env:
          FIREBASE_PROJECT_ID: demo-knowledge-vault
      - run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          VERCEL_DEPLOYMENT_ID: dpl_ci_build
          NITRO_PRESET: vercel
      - run: node --no-experimental-require-module scripts/verify-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
